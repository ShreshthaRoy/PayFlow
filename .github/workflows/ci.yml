
name: PayFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payflow_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow_app -d payflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        env:
          DB_PASSWORD: ci_password
        run: ./mvnw clean verify
